{% extends 'base.html' %}
{% block title %}Request Leave{% endblock %}
{% block content %}

<div class="ph"><div class="ph-left"><h1>Request Leave</h1></div></div>

<div class="form-wrap">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="display:flex; gap:0.75rem; margin-top:1.2rem;">
            <button type="submit" class="btn btn-accent">Submit Request</button>
            <a href="{% url 'leave_list' %}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
