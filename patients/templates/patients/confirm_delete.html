{% extends 'base.html' %}
{% block title %}Delete Patient{% endblock %}
{% block content %}

<div class="confirm-wrap">
    <h2>Delete Patient</h2>
    <p>Are you sure you want to delete <strong>{{ patient.full_name }}</strong>? This cannot be undone.</p>
    <div class="confirm-actions">
        <form method="post">{% csrf_token %}<button type="submit" class="btn btn-danger">Yes, Delete</button></form>
        <a href="{% url 'patient_list' %}" class="btn btn-ghost">Cancel</a>
    </div>
</div>
{% endblock %}
