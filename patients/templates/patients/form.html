{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block topbar_title %}{{ title }}{% endblock %}
{% block content %}

<div class="ph"><div class="ph-left"><h1>{{ title }}</h1></div></div>

<div class="form-wrap">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="display:flex; gap:0.75rem; margin-top:1.2rem;">
            <button type="submit" class="btn btn-accent">Save</button>
            <a href="{% url 'patient_list' %}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
