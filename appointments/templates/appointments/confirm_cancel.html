{% extends 'base.html' %}
{% block title %}Cancel Appointment{% endblock %}
{% block content %}

<div class="confirm-wrap">
    <h2>Cancel Appointment</h2>
    <p>Cancel appointment for <strong>{{ appt.patient.full_name }}</strong> on <strong>{{ appt.date }}</strong> ({{ appt.get_slot_display }})?</p>
    <div class="confirm-actions">
        <form method="post">{% csrf_token %}<button type="submit" class="btn btn-danger">Yes, Cancel</button></form>
        <a href="{% url 'appointment_list' %}" class="btn btn-ghost">Go Back</a>
    </div>
</div>
{% endblock %}
